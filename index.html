<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Itens à venda</title>
  <meta name="description" content="Itens à venda por causa de mudança: fotos, medidas e preços.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F3ECDF">

  <!-- Prévia do link no WhatsApp/Telegram. Se o endereço do site mudar, atualize o og:image abaixo
       (a imagem precisa de endereço completo). -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Itens à venda">
  <meta property="og:description" content="Fotos, medidas e preços. Retirada em Campinas/SP.">
  <meta property="og:image" content="https://itens-mudanca.vercel.app/images/capa.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,500..800;1,9..144,500..700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="titulo">Itens <em>à venda</em></h1>
      <p class="lede" id="lede"></p>
      <div class="chips">
        <p class="count" id="count" aria-live="polite"></p>
        <p class="count pickup" id="retirada"></p>
      </div>
    </header>

    <main>
      <noscript><p class="msg">Ative o JavaScript do navegador para ver os itens.</p></noscript>
      <div class="grid" id="grid"></div>
    </main>

    <footer class="foot" id="footer"></footer>
  </div>

  <dialog class="lb" id="lb" aria-label="Foto ampliada">
    <div class="lb-inner">
      <button class="lb-btn lb-close" type="button" id="lb-close" aria-label="Fechar">×</button>
      <button class="lb-btn lb-prev" type="button" id="lb-prev" aria-label="Foto anterior">‹</button>
      <img id="lb-img" alt="">
      <button class="lb-btn lb-next" type="button" id="lb-next" aria-label="Próxima foto">›</button>
      <p class="lb-count" id="lb-count"></p>
    </div>
  </dialog>

  <script src="itens.js"></script>
  <script src="app.js"></script>
</body>
</html>
